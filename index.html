{k:"🛑",t:"Permission, Consent & Infringement",c:"LESI-IIIg-17 · RA 8293 · RA 10173",
hook:"Using someone’s work or data the right way starts with one word: permission!",
def:[["Permission","Approval from the owner or copyright holder to use a work. A license is permission in writing."],["Consent","A person’s clear, voluntary agreement to let you use their personal information, photo, or voice."],["Copyright infringement","Using a copyrighted work without permission and outside fair use."],["Plagiarism","Passing off someone else’s words or ideas as your own. It is an ethical wrong; infringement is a legal wrong. One act can be both."],["Copyright law (RA 8293)","The Intellectual Property Code of the Philippines. It gives creators exclusive rights over their works."],["Fair use","The copyright doctrine that allows limited use for commentary, criticism, reporting, research, and teaching."],["Logo","A symbol that identifies a business. It is protected as a trademark."],["Geographical indication","A name that points to a country or place as the origin of a product."],["Privacy act (RA 10173)","The Data Privacy Act of 2012. It protects personal information and requires consent for its use."]],
nums:[["Ask permission","Contact the owner or check the license.","Email a photographer before using the photo in a poster."],["Give credit","Cite the creator and source.","Write the author, title, and year under a quote."],["Check fair use","Test the 4 factors before using without a license.","A short clip for class criticism is more likely fair."],["Get consent","Ask before posting people’s photos or details.","Ask a classmate before uploading her picture."],["Know the law","RA 8293 for IP, RA 10173 for privacy, RA 10175 for cybercrime.","Copying a film and posting it online can break the law."]],nl:"Do it the right way",

{k:"🧪",t:"Reliable Information & Sources",c:"MIL · Information literacy",
hook:"Not everything online is true. Let us become fact detectives!",
def:[["Verifiable information","Information that can be checked and proven. Also called fact."],["Fact-checking (verification)","Checking whether information is factual."],["Source evaluation","Evaluating an article’s author, date, and evidence."],["Reliable information","Information supported by evidence from a trustworthy source. (Reliable means dependable. “Liable” means legally responsible, so the word for sources is reliable.)"],["Primary source","A firsthand record: interview, diary, photo, raw data, official document."],["Secondary source","Explains or interprets primary sources: textbook, news analysis."],["Misinformation","False information shared WITHOUT intent to harm. The sharer believes it."],["Disinformation","False information spread ON PURPOSE to deceive."]],
nums:[["Currency","Is the information recent enough for your research purpose?","A 2008 article on phone prices is outdated."],["Relevance","Does it fit your topic and audience?","A cooking blog is not relevant to a law report."],["Authority","Who is the author or publisher? Are they qualified?","A doctor writing on health."],["Accuracy","Is it supported by evidence and can it be checked?","Cites data and links to sources."],["Purpose","Why was it made: inform, sell, persuade, or deceive?","An ad is meant to sell."]],nl:"Source evaluation criteria (C-R-A-A-P)",

q:[["False information spread on purpose is…",["Disinformation","Misinformation"],0,"Dis = deliberate."],["Which is a copyright doctrine?",["Fair use","Phishing"],0,"Fair use is a doctrine in copyright law."]]},{k:'🎥',t:'Camera Angles, Shots & Movements',c:'MIL11/12MILA-IIIf15 · Technical codes',hook:'Where you put the camera changes how the audience feels. Let us see every angle, shot, and movement, with pictures!',def:[['Technical codes','Ways equipment is used to tell the story: camera angles, framing, depth of field, and lighting.'],['Camera angle','Where the camera sits compared with the subject. In each picture below, the left side shows the camera and the right side shows what the audience sees.'],['Shot size (framing)','How much of the subject fits in the frame, from far away to very close.'],['Camera movement','How the camera moves during a shot. Watch the animated pictures.']],nl:'16 camera techniques',nums:[['Eye-level angle','Camera at the subject’s eye height. Feels natural, neutral, and honest.','Two friends talking in a school hallway.'],['High angle','Camera above, looking down. The subject looks small, weak, or vulnerable.','A student alone in a huge exam hall.'],['Low angle','Camera below, looking up. The subject looks powerful, tall, or heroic.','The ruler in The Kingdom scenario.'],['Bird’s-eye view','Camera directly overhead. Shows the whole scene and makes people look tiny.','A crowd gathered outside the exam results.'],['Dutch angle','Camera tilted so the horizon is slanted. Creates unease, tension, or confusion.','A chase or a character losing control.'],['Over-the-shoulder','Camera behind one person, facing another. Builds connection in conversations.','An adult speaking with a teen in Sunshine.'],['Long shot','Shows the whole body and the setting. Tells where the story happens.','A student walking across a big school yard.'],['Medium shot','Shows the person from the waist up. Good for conversation and body language.','Two characters arguing at a table.'],['Close-up','Shows the face. Reveals emotion.','Tired faces in the Bar Boys study scene.'],['Extreme close-up','Shows one tiny detail such as eyes or hands. Builds intensity.','Shaky hands holding notes.'],['Pan','The camera turns left or right from a fixed spot. Follows action or reveals a place.','Sweeping across a cheering crowd.'],['Tilt','The camera turns up or down from a fixed spot. Reveals height.','Tilting up a tall building.'],['Zoom','The lens moves the view closer or farther. The camera itself stays put.','Zooming in on a shocked reaction.'],['Dolly','The camera physically moves toward or away from the subject.','Moving slowly toward a worried character.'],['Tracking shot','The camera moves alongside the subject.','Following two students walking and talking.'],['Crane shot','The camera rises or lowers on a crane. Gives grand reveals.','Rising above a graduation crowd.']],sv:[ang(20,70,1,0,0),ang(40,12,.7,10,0),ang(40,100,1.35,4,0),ang(100,8,1,0,0,'top'),ang(20,70,1,0,-18,0,18),ang(20,70,1,0,0,'ots'),ang(8,78,.55,0,0),ang(50,78,1.6,30,0),ang(75,74,2.6,78,0),ang(80,74,5,150,0),mv('Pan: turns left ↔ right',['rotate','-25 0 0;25 0 0;-25 0 0'],0,60),mv('Tilt: turns up ↕ and down',['rotate','-20 0 0;20 0 0;-20 0 0'],0,60),mv('Zoom: subject grows, camera stays',0,['scale','1;2;1'],60),mv('Dolly: camera moves in and out',['translate','0 0;100 0;0 0'],0,40),mv('Tracking: camera moves with subject',['translate','0 0;50 0;0 0'],['translate','0 0;50 0;0 0'],40),mv('Crane: camera rises and falls',['translate','0 25;0 -35;0 25'],0,60)],q:[['The camera is above the subject looking down. The subject looks…',['Small and weak','Powerful and heroic'],0,'High angle makes the subject look small or vulnerable.',ang(40,12,.7,10,0)],['The camera is below the subject looking up. The subject looks…',['Weak','Powerful'],1,'Low angle makes the subject look strong.',ang(40,100,1.35,4,0)],['This slanted horizon is called…',['Dutch angle','Tilt','Eye-level'],0,'A tilted camera creates a Dutch angle and a feeling of unease.',ang(20,70,1,0,-18,0,18)],['Which shot shows a character’s emotion best?',['Long shot','Close-up'],1,'Close-ups show the face and feelings.',ang(75,74,2.6,78,0)],['The camera turns left to right from a fixed spot. This is a…',['Pan','Dolly','Zoom'],0,'A pan turns the camera in place.',mv('Pan: turns left ↔ right',['rotate','-25 0 0;25 0 0;-25 0 0'],0,60)],['The camera physically moves toward the subject. This is a…',['Zoom','Dolly'],1,'A dolly moves the camera. A zoom only changes the lens.',mv('Dolly: camera moves in and out',['translate','0 0;100 0;0 0'],0,40)]]}];

const EX=[['Mia wants to use a photographer’s picture on her class poster. The photo is labeled CC BY-NC.','What must Mia do?',['Credit the photographer and not sell the poster','Edit the photo and sell copies','Use it with no credit','Say she took the photo'],0,'BY means give credit. NC means no commercial use.'],['Ben copies three paragraphs from a website into his research paper and does not cite the source.','What is this?',['Plagiarism','Fair use','Netiquette','Public domain'],0,'Passing off someone else’s words as yours is plagiarism.'],['A teacher plays a 1-minute film clip in class to discuss how it was made.','Which fair use factors support the teacher?',['Teaching purpose and a small portion','The whole film is shown','The clip is sold to students','The clip is posted online for profit'],0,'Teaching purpose, small amount, and no market harm favor fair use.'],['A classmate posts a group photo and tags you without asking. You feel uncomfortable.','Which principle was ignored?',['Consent and privacy (RA 10173)','Fair use','Patent','Currency'],0,'Personal data and images need consent.'],['You get a text: “Your bank account closes in 1 hour. Send your OTP now.”','What is the best response?',['Do not reply, report it, and delete it','Send the OTP quickly','Click the link to check','Forward it to friends'],0,'This is phishing: urgency plus a request for private data.'],['A friend shares a post she truly believes saying classes are suspended. The post is false.','What is this?',['Misinformation','Disinformation','Infringement','Fair use'],0,'False info shared without intent to harm is misinformation.'],['A page invents a fake news story on purpose to turn people against a rival.','What is this?',['Disinformation','Misinformation','Netiquette','Consent'],0,'Deliberate deception is disinformation.'],['You are researching current smartphone prices. The best-looking article is from 2009.','Which source evaluation criterion does it fail?',['Currency','Purpose','Consent (function(){const w=L.find(x=>x.t.indexOf('Word Bank')==0),skip=['rule of thumb','big idea','goal','why it matters','guide questions','key issues','group them'],seen={},out=[],X=[['Internet addiction','Compulsive, harmful overuse of the internet that affects school, sleep, health, and relationships.'],['Cyberbullying','Using digital media to repeatedly hurt, threaten, embarrass, or harass someone.'],['Producer','The person or group that creates and funds a media message, and has a purpose for making it.'],['Stakeholder','Anyone who is affected by, or involved in, a media message or its issue.'],['Message','The idea or meaning a media text wants the audience to receive.'],['Depth of field','How much of the scene, from near to far, is in sharp focus (technical code).'],['Lighting','How light and shadow set the mood, such as dim light for fear or sadness (technical code).'],['Body language','Gestures, posture, and expressions that show feelings without words (symbolic code).']];const G=[],BL={'Roadmap & Competencies':['This is your map. Two competencies guide the whole reviewer: applying what you know about intellectual property, copyright, and fair use to real situations, and evaluating media in terms of codes, conventions, and messages. The big idea is that the rights and responsibilities of media and information providers and consumers make us digital citizens.','Every lesson links back to one of these two competencies.'],'Intellectual Property':['Intellectual property (IP) means creations of the mind: inventions, writings, art, designs, and the names, symbols, and images used in business. It has two big families. Industrial property covers patents, trademarks, industrial designs, and geographical indications. Copyright covers works like novels, films, music, paintings, and architecture. In the Philippines, RA 8293 protects IP rights, while RA 10175 deals with cybercrime.','Industrial property is for business. Copyright is for creative works.'],'Types of IP & Protection':['Different creations need different protection. Match what you made to the right type, and you know which protection applies.','Ideas and inventions go to patents. Names and logos go to trademarks. Looks go to industrial designs. Creative works go to copyright.'],'Fair Use':['Fair use lets you use copyrighted work without a license for limited purposes: commentary, criticism, reporting, research, and teaching. It exists to balance the creator’s rights with the public’s need to learn and discuss.','Fair use is a doctrine inside copyright law, not a free pass for everything.'],'Licenses & Creative Commons':['A license is permission from the copyright holder. Creative Commons (CC) licenses are built on top of copyright. The creator still owns the work but chooses which rights to share, so “All rights reserved” becomes “Some rights reserved.” Public domain is different: no copyright applies, so anyone can use the work freely.','You can only license what you own.'],'Netiquette':['Netiquette is network etiquette, a set of rules for behaving properly online (Shea, 1997). One example of breaking those rules is flaming, which means expressing a strong opinion with no restraint of emotion.','Good manners count online too.'],'Digital Citizenship Issues':['A digital citizen understands their rights and responsibilities as a provider and consumer of media and information. The five key issues are intellectual property, fair use, netiquette, internet addiction, and cyberbullying. To judge any situation, ask: Is a Philippine law violated? What criteria did I use to judge, and did they help me judge better?','Rights come with responsibilities.'],'Media Languages':['Media speaks in a language of its own. Codes are systems of signs that create meaning. Conventions are the generally accepted ways of doing things. A genre is recognized by the codes and conventions it shares with similar works.','Codes are the signs. Conventions are the habits.'],'Analyze a Media Message':['To analyze a media message, look at its codes, conventions, and message. Then think about who it is for (the audience), who made it (the producer), and who is affected by it (the stakeholders).','Ask: who made this, who is it for, and what is it saying?'],'Permission, Consent & Infringement':['Permission is approval from the owner or copyright holder, and a license is permission in writing. Consent is a person’s clear, voluntary agreement to let you use their personal information, photo, or voice. Using a work without permission and outside fair use is copyright infringement. Plagiarism is an ethical wrong, infringement is a legal wrong, and one act can be both. RA 8293 protects creators, and RA 10173 (Data Privacy Act of 2012) protects personal information.','Work needs permission. People’s data needs consent.'],'Reliable Information & Sources':['Not everything online is true, so check it. Verifiable information can be checked and proven. Evaluate a source by its author, date, and evidence. A primary source is a firsthand record, while a secondary source explains or interprets primary sources. False information comes in two kinds: misinformation is shared without intent to harm, and disinformation is spread on purpose.','Dis = deliberate.'],'Digital Divide & Online Safety':['The digital divide is the gap between people who have access to digital technology and the internet and those who lack it. Online safety also means spotting phishing, a scam that tricks you into giving passwords or personal data through fake emails, texts, or sites.','Never share personal data without clear agreement.'],'Codes in Detail: Camera, Fonts & Audience':['Written work codes are language style and layout, such as headlines, captions, speech bubbles, and font styles. Formal and informal fonts change the feel of a message. Every message is made for a target audience, a specific group defined by age, interest, or need.','Change the font or the audience, and the message changes too.'],'Camera Angles, Shots & Movements':['Technical codes are the ways equipment is used to tell the story. A camera angle is where the camera sits compared with the subject, shot size is how much of the subject fits in the frame, and camera movement is how the camera moves during a shot.','Looking down makes people small. Looking up makes people strong. Far shows the place, medium is for talking, close shows feeling.'],'other':['These extra terms appear across many lessons. A producer creates a media message, a stakeholder is anyone affected by it, and the message is the idea it wants to give. Internet addiction and cyberbullying are key digital citizenship issues. Depth of field, lighting, and body language are codes that shape how a scene feels.','Use these words when you analyze any media message.']};const addG=(h,arr,t)=>{arr.sort((a,b)=>a[0].toLowerCase().localeCompare(b[0].toLowerCase()));if(arr.length){G.push({h:h,b:BL[t]||null,n:arr});arr.forEach(d=>out.push(d))}};L.forEach(x=>{if(x===w)return;const g=[];x.def.concat(x.nums.map(n=>[n[0],n[1]])).forEach(d=>{const k=d[0].toLowerCase();if(skip.indexOf(k)>-1||seen[k])return;seen[k]=1;g.push([d[0],d[1]])});addG(x.k+' '+x.t,g,x.t)});const gx=[];X.forEach(d=>{const k=d[0].toLowerCase();if(!seen[k]){seen[k]=1;gx.push([d[0],d[1]])}});addG('🧩 Other key terms',gx,'other');w.grps=G;w.def=out;w.wb=1;w.hook='All '+out.length+' terms in '+G.length+' sections, one per lesson. Tap a section to open it, or use the search box to find a word fast!'})();const PAL=['#1f7a8c','#d6336c','#e8890c','#2b8a3e','#7048e8','#0c8599','#c2255c','#5c940d'];function wbUI(l){return `<div class='wbtool'><button class='wbt' data-wb='1'>▾ Open all</button><button class='wbt' data-wb='0'>▴ Close all</button></div>`+l.grps.map((g,i)=>`<details class='wbg' style='--g:${PAL[i%PAL.length]}'><summary><span class='wbh'>${g.h}</span><span class='wbn'>${g.n.length}</span></summary><div class='wbb'>${g.b?`<div class='lesn'><span class='lt'>📖 Mini lesson</span><p>${g.b[0]}</p>${g.b[1]?`<p class='tip'>💡 ${g.b[1]}</p>`:''}</div>`:''}<ul class='d'>${g.n.map(d=>`<li><b>${d[0]}:</b> ${d[1]}</li>`).join('')}</ul></div></details>`).join('')}document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-wb]');if(b)document.querySelectorAll('#v details.wbg').forEach(d=>{d.open=b.dataset.wb=='1'})});function fab(){const f=$('#fab'),m=S.m||'learn',n=f.querySelector('.nx'),p=f.querySelector('.pv');let nl='Next',nd=0,pd=0;if(m=='learn'){const t=S.tab=='teach',last=S.l>=L.length-1;if(t&&B.length&&S.b<B.length-1)nl='Next step';else{nl=last?'End':'Next lesson';nd=last}pd=t&&S.b>0?0:S.l==0}else{const r=S.run;if(!r){nl='Start'}else if(r.done){nl='Lessons'}else{const it=r.items[r.i];nl=r.i==r.items.length-1?'Finish':'Next';nd=it.p==null;pd=r.i==0}}n.querySelector('small').textContent=nl;n.disabled=!!nd;p.disabled=!!pd} function fabGo(d){const m=S.m||'learn',nx=d=='next';if(m=='learn'){if(S.tab=='teach'&&B.length){if(nx&&S.b<B.length-1)return go(1);if(!nx&&S.b>0)return go(-1)}const l=S.l+(nx?1:-1);if(l>=0&&l<L.length){S.l=l;render();scrollTo(0,0)}return}if(!S.run)return nx?act('start'):0;if(S.run.done)return nx?mode('learn'):0;act(nx?'next':'prev')} document.addEventListener('input',e=>{if(e.target.id=='ws'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('#v details.wbg').forEach(dt=>{let any=0;dt.querySelectorAll('ul.d li').forEach(li=>{const m=li.textContent.toLowerCase().indexOf(q)>-1;li.style.display=m?'':'none';if(m)any=1});dt.style.display=any?'':'none';dt.open=q?!!any:false})}});new MutationObserver(fab).observe($('#v'),{childList:true,subtree:true});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.fab){fabGo(t.dataset.fab)}else if(t.dataset.t=='quiz'){mode('quick')}else if(t.dataset.act){act(t.dataset.act,t.dataset.v)}else if(t.dataset.m){mode(t.dataset.m)}else if(t.dataset.hub){S.h=true;S.mix=false;render()}else if(t.dataset.qp){S.h=false;S.mix=t.dataset.qp=='mix';if(!S.mix)S.l=+t.dataset.qp;render();scrollTo(0,0)}else if(t.dataset.l!=null){S.l=+t.dataset.l;render();scrollTo(0,0)}
else if(t.dataset.t){S.tab=t.dataset.t;render()}
else if(t.id=="pp"){S.play=!S.play;show()}else if(t.id=="nx")go(1);else if(t.id=="pv")go(-1);else if(t.id=="rp"){S.b=0;S.play=true;show()}
else if(t.dataset.s){S.sp=+t.dataset.s;document.querySelectorAll(".sp").forEach(x=>x.classList.toggle("on",x==t));show()}
else if(t.dataset.b!=null){S.b=+t.dataset.b;show()}else if(t.dataset.r=='mix'){mixItems().forEach(([a,b])=>{const k=a+'_'+b;if(S.ans[k]==L[a].q[b][2])S.sc--;delete S.ans[k]});S.mx=null;$('#sc').textContent=S.sc;render()}else if(t.dataset.r){L[S.l].q.forEach((q,i)=>{const k=S.l+'_'+i;if(S.ans[k]==q[2])S.sc--;delete S.ans[k]});$('#sc').textContent=S.sc;render()}
else if(t.dataset.q&&S.ans[t.dataset.q]==null){const[li,qi]=t.dataset.q.split("_"),o=+t.dataset.o;S.ans[t.dataset.q]=o;if(o==L[li].q[qi][2]){S.sc++;$("#sc").textContent=S.sc}render()}});
